<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>점프 투 파이썬 퀴즈 1~5장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><main>
<button class="tt" id="theme" aria-label="테마 전환">🌓</button>
<h1>🐍 점프 투 파이썬 퀴즈</h1>
<p class="sub">기초부터 실무 핵심 50문항 · 틀리면 초보자용 풀이를 알려드려요</p>

<section id="start" class="card start">
  <div class="big">50문제</div>
  <p>보기를 눌러 답을 고르세요.<br>정답이면 <b style="color:var(--ok)">O</b>, 틀리면 쉬운 풀이가 나옵니다.<br><small style="color:var(--mute)">키보드 1~4 로도 선택, Enter 로 다음 문제</small></p>
  <button class="btn" id="go">시작하기</button>
</section>

<section id="quiz" class="hide">
  <div class="top">
    <button class="btn-back" id="back-home" type="button" aria-label="처음으로 나가기">← 처음으로</button>
    <span id="no"></span>
    <span id="sc"></span>
  </div>
  <div class="bar"><i id="pb"></i></div>
  <div class="card">
    <span class="chap" id="chap"></span>
    <p class="q" id="qt"></p>
    <pre id="code" class="hide"></pre>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    <div class="btn-group">
      <button class="btn ghost" id="prev" type="button">← 이전 문제</button>
      <button class="btn" id="next" type="button">다음 문제 →</button>
    </div>
  </div>
</section>

<section id="result" class="card result hide">
  <div>최종 점수</div>
  <div class="big" id="rs"></div>
  <p id="rm"></p>
  <button class="btn" id="retryw">틀린 문제만 다시 풀기</button>
  <button class="btn ghost" id="again">처음부터 다시</button>
</section>
</main>
<div id="fx"></div>

<script src="script.js"></script></body></html>
